name: Check deployed schemas

on:
  schedule:
    - cron: "17 0 * * 1" # Monday 09:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compare published canonical and SchemaStore schemas
        run: sh scripts/check-deployed-schemas.sh
